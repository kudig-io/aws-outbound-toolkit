# Example values for Karpenter.
# Replace every placeholder. Karpenter requires:
#   - an IAM role for the controller (IRSA)
#   - a node IAM role with instance-profile access
#   - an interruption queue (SQS) and EventBridge rules
# Provision the NodePool/EC2NodeClass separately; this file only configures the controller.

settings:
  clusterName: outbound-prod
  clusterEndpoint: https://ABCDEF1234567890.gr7.ap-southeast-1.eks.amazonaws.com
  interruptionQueue: Karpenter-outbound-prod

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/karpenter-controller

replicas: 2

controller:
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: 2
      memory: 2Gi

podDisruptionBudget:
  maxUnavailable: 1

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: karpenter