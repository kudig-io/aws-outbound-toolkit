apiVersion: v1
kind: Namespace
metadata:
  name: example
  labels:
    env: prod
    owner: team-example
    service: example
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: example-quota
  namespace: example
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    pods: "100"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: example-defaults
  namespace: example
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi